name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: buditel
          POSTGRES_PASSWORD: buditel
          POSTGRES_DB: buditel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buditel"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://buditel:buditel@localhost:5432/buditel
      TEST_DATABASE_URL: postgres://buditel:buditel@localhost:5432/buditel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: make install
      - run: make lint
      - run: make db-migrate
      - run: make test
      - run: npx playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
